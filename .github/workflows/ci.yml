name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build / test / lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # The sibling TPT repositories are public and fetch anonymously. If one becomes private,
    # set the TPT_GIT_TOKEN secret (a fine-grained PAT with read-only contents access) and
    # the step below rewrites GitHub URLs to use it. Without the secret, nothing changes.
    # The secret is passed through `env` because the `secrets` context is not available in `if:`.
    env:
      TPT_GIT_TOKEN: ${{ secrets.TPT_GIT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure git auth for sibling repositories
        if: ${{ env.TPT_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${TPT_GIT_TOKEN}@github.com/TPT-Solutions".insteadOf "https://github.com/TPT-Solutions"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
