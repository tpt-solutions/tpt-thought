[package]
name = "tpt-thought-core"
description = "Core types for TPT Thought: thoughts, IDs, confidence, uncertainty, time and wire encoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = ["os-entropy"]
# Cryptographically strong OS entropy source for ID generation.
os-entropy = ["dep:getrandom"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
minicbor-serde = { workspace = true }
getrandom = { version = "0.3", optional = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
