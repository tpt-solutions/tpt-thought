[package]
name = "tpt-thought-integrations"
description = "TPT Thought adapters for the sibling TPT repositories (Intellect, Eve, Anima, Augur, Axiom). The only crate that depends on sibling repositories."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = []
intellect = ["dep:tpt-intellect-core", "dep:tpt-intellect-backend"]
eve = ["dep:tpt-eve-metacognition", "dep:tpt-eve-causal", "dep:tpt-eve-abstraction", "dep:tpt-eve-active-learning"]
anima = ["dep:tpt-anima-sse", "dep:tpt-anima-inp", "dep:tpt-anima-ck"]
augur = ["dep:tpt-augur-ir", "dep:tpt-augur-runtime"]
axiom = ["dep:tpt-axiom-core"]

[dependencies]
tpt-thought-core = { workspace = true }
tpt-thought-providers = { workspace = true }
tpt-thought-deliberation = { workspace = true }
tpt-thought-workspace = { workspace = true }
serde = { workspace = true }

# Sibling repositories, each pinned to the revision reviewed for this crate.
tpt-intellect-core = { git = "https://github.com/TPT-Solutions/tpt-intellect", rev = "a502c0139a7e5cc12b7adf8fb9bdbbae31f69ffc", optional = true }
tpt-intellect-backend = { git = "https://github.com/TPT-Solutions/tpt-intellect", rev = "a502c0139a7e5cc12b7adf8fb9bdbbae31f69ffc", optional = true }
tpt-eve-metacognition = { git = "https://github.com/TPT-Solutions/tpt-eve", rev = "c230d0e83633bd0a7f8d3e6a5d830f48236427ad", optional = true }
tpt-eve-causal = { git = "https://github.com/TPT-Solutions/tpt-eve", rev = "c230d0e83633bd0a7f8d3e6a5d830f48236427ad", optional = true }
tpt-eve-abstraction = { git = "https://github.com/TPT-Solutions/tpt-eve", rev = "c230d0e83633bd0a7f8d3e6a5d830f48236427ad", optional = true }
tpt-eve-active-learning = { git = "https://github.com/TPT-Solutions/tpt-eve", rev = "c230d0e83633bd0a7f8d3e6a5d830f48236427ad", optional = true }
tpt-anima-sse = { git = "https://github.com/TPT-Solutions/tpt-anima", rev = "408c2e0065ba99e619fa7277d3801e0c9abad0ff", optional = true }
tpt-anima-inp = { git = "https://github.com/TPT-Solutions/tpt-anima", rev = "408c2e0065ba99e619fa7277d3801e0c9abad0ff", optional = true }
tpt-anima-ck = { git = "https://github.com/TPT-Solutions/tpt-anima", rev = "408c2e0065ba99e619fa7277d3801e0c9abad0ff", optional = true }
tpt-augur-ir = { git = "https://github.com/TPT-Solutions/tpt-augur", rev = "634f67a5ed632f9bba082cafeeb921c22dc18195", optional = true }
tpt-augur-runtime = { git = "https://github.com/TPT-Solutions/tpt-augur", rev = "634f67a5ed632f9bba082cafeeb921c22dc18195", optional = true }
tpt-axiom-core = { git = "https://github.com/TPT-Solutions/tpt-axiom", rev = "495ab6360feb58c5e518379d2ffcb2c32a24c420", optional = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
