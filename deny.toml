# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
# MIT-compatible allow-list. Apache-2.0-only crates are deliberately NOT listed;
# a crate passes only if its SPDX expression can be satisfied by an allowed licence
# (e.g. "MIT OR Apache-2.0" passes through MIT).
allow = [
    "MIT",
    "BlueOak-1.0.0", # permissive, OSI-approved; used by minicbor (CBOR encoding)
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Vendor SDK crates must never be dependencies (spec §57); adapters live behind provider traits.
deny = [
    { crate = "async-openai" },
    { crate = "openai" },
    { crate = "openai-api-rs" },
    { crate = "anthropic" },
    { crate = "ollama-rs" },
    { crate = "google-generative-ai-rs" },
    { crate = "hf-hub" },
    { crate = "tokio" },
]

[advisories]
version = 2
# Transitive through the `zkpa` feature (tpt-anima-zkpa -> ark-groth16 / ark-ff / ark-relations).
# No safe upgrade exists; revisit when tpt-anima moves to a newer arkworks release.
ignore = [
    { id = "RUSTSEC-2024-0388", reason = "derivative via ark-crypto-primitives (zkpa feature); no safe upgrade" },
    { id = "RUSTSEC-2024-0436", reason = "paste via ark-ff (zkpa feature); no safe upgrade" },
    { id = "RUSTSEC-2025-0055", reason = "tracing-subscriber 0.2.25 via ark-relations (zkpa feature); no safe upgrade" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Sibling TPT repos (only consumed by tpt-thought-integrations):
allow-git = [
    "https://github.com/TPT-Solutions",
    "https://github.com/TPT-Solutions/tpt-intellect",
    "https://github.com/TPT-Solutions/tpt-eve",
    "https://github.com/TPT-Solutions/tpt-anima",
    "https://github.com/TPT-Solutions/tpt-augur",
    "https://github.com/tpt-solutions/tpt-axiom",
    "https://github.com/tpt-solutions/tpt-infer.git",
    "https://github.com/tpt-solutions/tpt-pulse",
]
